# Chạy kiểm thử mỗi lần đẩy lên GitHub hoặc mở pull request.
# Không chạy lại notebook (mất vài phút và cần dữ liệu thu thập): dùng mô hình và dữ liệu đã lưu trong repo.
# Chạy lại toàn bộ trên máy: python scripts/chay_toan_bo.py ; kiểm thử web đầu-cuối: docker compose up -d && node tests/kiem_tra_web.mjs
name: Kiểm thử
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  mo-hinh-va-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - name: Kiểm thử mô hình và dữ liệu (đủ phần mở rộng, rồi chế độ bài chính)
        run: python -X utf8 tests/kiem_tra_mo_hinh.py && python -X utf8 tests/kiem_tra_mo_hinh.py --nha-pho
      - name: Kiểm thử API mô hình (đủ phần mở rộng, rồi chế độ bài chính)
        run: python -X utf8 tests/kiem_tra_api.py && python -X utf8 tests/kiem_tra_api.py --nha-pho
      - name: Kiểm thử công bố bộ tệp của API (trên bản sao tạm)
        run: python -X utf8 tests/kiem_tra_cong_bo.py
      - name: Kiểm thử bản tĩnh và trợ lý
        run: node tests/kiem_tra_tro_ly.js
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
